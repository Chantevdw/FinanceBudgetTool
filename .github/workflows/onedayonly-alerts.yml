name: OneDayOnly deal alerts

on:
  schedule:
    # Every hour — main drop is at midnight SAST (UTC+2), but new deals
    # can appear during the day too. Already-alerted deals are skipped,
    # so hourly checks don't repeat themselves.
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print alerts instead of sending them)"
        type: boolean
        default: false
      test_ping:
        description: "Send a test notification instead of checking deals"
        type: boolean
        default: false
      debug_dump:
        description: "Dump product data structure to the log (no alerts sent)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: onedayonly-alerts
  cancel-in-progress: false

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deals and send alerts
        env:
          # The NTFY_TOPIC secret (if set) overrides the fallback topic here.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'odo-deals-chante-x7k2' }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          MAX_PRICE: '50'
          MIN_DISCOUNT_PCT: '70'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TEST_PING: ${{ inputs.test_ping && '1' || '0' }}
          DEBUG_DUMP: ${{ inputs.debug_dump && '1' || '0' }}
        run: python3 onedayonly-alerts/check_deals.py

      - name: Save alert history (so you aren't re-alerted for the same deal)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onedayonly-alerts/state/alerted.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update OneDayOnly alert history"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload debug pages if parsing found nothing
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-pages-debug
          path: onedayonly-alerts/state/debug/
          if-no-files-found: ignore
          retention-days: 5
