name: OneDayOnly deal alerts

on:
  schedule:
    # OneDayOnly's new deals go live at midnight SAST (UTC+2).
    - cron: '15 22 * * *'   # 00:15 SAST — catch the fresh deals
    - cron: '0 7 * * *'     # 09:00 SAST — catch-up for late additions
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print alerts instead of sending WhatsApp)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: onedayonly-alerts
  cancel-in-progress: false

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deals and send alerts
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          MAX_PRICE: '50'
          MIN_DISCOUNT_PCT: '70'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 onedayonly-alerts/check_deals.py

      - name: Save alert history (so you aren't re-alerted for the same deal)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onedayonly-alerts/state/alerted.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update OneDayOnly alert history"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload debug pages if parsing found nothing
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-pages-debug
          path: onedayonly-alerts/state/debug/
          if-no-files-found: ignore
          retention-days: 5
