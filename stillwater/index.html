<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stillwater</title>
  <style>
    :root {
      --ink: #2b3a3a;
      --paper: #f7f1e3;
      --accent: #2f8f83;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #d7ece4;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
    }
    .hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      pointer-events: none;
    }
    .title {
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.75;
    }
    .hint {
      position: fixed;
      top: 52px;
      left: 20px;
      right: 20px;
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.6;
      pointer-events: none;
    }
    .controls {
      position: fixed;
      bottom: calc(22px + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    button {
      font: inherit;
      font-size: 15px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      min-width: 52px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      box-shadow: 0 2px 12px rgba(43, 58, 58, 0.08);
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(247, 241, 227, 0.72);
      backdrop-filter: blur(4px);
    }
    .overlay.show { display: flex; }
    .card {
      margin: 16px;
      padding: 30px 32px;
      max-width: 320px;
      text-align: center;
      background: var(--paper);
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(43, 58, 58, 0.14);
    }
    .card h2 {
      margin: 0 0 10px;
      font-weight: 500;
      font-size: 26px;
    }
    .card p {
      margin: 0 0 20px;
      line-height: 1.5;
      opacity: 0.7;
    }
    .card button {
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Stillwater puzzle board"></canvas>

  <div class="hud">
    <div class="title" id="level-title"></div>
    <div class="title" id="level-count"></div>
  </div>
  <div class="hint" id="hint"></div>

  <div class="controls">
    <button id="rot-left" aria-label="Turn the world left">&#x27F2;</button>
    <button id="restart">Restart</button>
    <button id="rot-right" aria-label="Turn the world right">&#x27F3;</button>
  </div>

  <div class="overlay" id="win" role="dialog" aria-modal="true">
    <div class="card">
      <h2 id="win-title"></h2>
      <p id="win-text"></p>
      <button id="next"></button>
    </div>
  </div>

  <script src="levels.js"></script>
  <script src="rules.js"></script>
  <script src="game.js"></script>
</body>
</html>
